<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudMetrics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand text-info fw-bold" href="#">
        ☁️ CloudMetrics
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-info" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Precios</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 py-4">
    <div class="row align-items-center g-4">

      <div class="col-12 col-lg-7 text-center text-lg-start">
        <h1 class="display-3 fw-bold mb-3">Métricas en Tiempo Real para tu Negocio</h1>
        <p class="lead text-muted mb-4">
          Monitorea la salud de tus servidores con métricas precisas y alertas instantáneas.
        </p>
        <button class="btn btn-info text-white btn-lg px-4">Probar Gratis</button>
      </div>

      <div class="col-12 col-lg-5 text-center">
        <div class="card bg-dark text-info p-4 shadow">
          <div class="card-body">
            <h2 class="display-5 fw-bold text-info my-2">99.99%</h2>
            <p class="card-text text-white fw-bold text-uppercase small">UPTIME GARANTIZADO</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
